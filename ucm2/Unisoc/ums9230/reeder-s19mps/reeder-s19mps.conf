Syntax 7

Comment "Reeder S19 Max Pro S"

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "ums9230_mono_in"
			Direction Capture
			Channels 1
			HWChannels 2
			HWChannelPos0 MONO
			HWChannelPos1 MONO
		}
	}
]

SectionUseCase."HiFi" {
	File "/Unisoc/ums9230/reeder-s19mps/HiFi.conf"
	Comment "Default"
}

SectionUseCase."Voice Call" {
	File "/Unisoc/ums9230/reeder-s19mps/VoiceCall.conf"
	Comment "Voice call (earpiece)"
}

SectionUseCase."Voice Call Speaker" {
	File "/Unisoc/ums9230/reeder-s19mps/VoiceCallSpeaker.conf"
	Comment "Voice call (built-in speaker)"
}

SectionUseCase."Voice Call Headphones" {
	File "/Unisoc/ums9230/reeder-s19mps/VoiceCallHeadphones.conf"
	Comment "Voice call (headphones)"
}

SectionUseCase."Voice Call Headset" {
	File "/Unisoc/ums9230/reeder-s19mps/VoiceCallHeadset.conf"
	Comment "Voice call (headset)"
}

SectionDefaults [
	cset "name='Speaker Switch' off"
	cset "name='Headphone Playback Switch' off"
	cset "name='Earpiece Playback Switch' off"
]
